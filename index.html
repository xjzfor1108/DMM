<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网页贪吃蛇游戏</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: Arial;}
        body {background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 30px;}
        h1 {color: #4cd964; margin-bottom: 10px;}
        .score {color: white; font-size: 20px; margin-bottom: 10px;}
        #gameCanvas {border: 3px solid #4cd964; background: #000;}
        .tip {color: #aaa; margin-top: 10px; font-size: 14px;}
    </style>
</head>
<body>
    <h1>贪吃蛇小游戏</h1>
    <div class="score">得分：<span id="scoreNum">0</span></div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div class="tip">方向键控制蛇移动，吃到绿色食物加分，撞墙/撞自己游戏结束</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDom = document.getElementById('scoreNum');
        const grid = 20; // 格子大小
        let snake = [{x:15, y:15}]; // 蛇初始位置
        let food = {x:5, y:5};
        let dx = 1, dy = 0; // 移动方向
        let score = 0;
        let gameOver = false;

        // 键盘控制方向
        document.addEventListener('keydown', e=>{
            if(gameOver) return;
            switch(e.key){
                case 'ArrowUp': if(dy!==1){dx=0;dy=-1;} break;
                case 'ArrowDown': if(dy!==-1){dx=0;dy=1;} break;
                case 'ArrowLeft': if(dx!==1){dx=-1;dy=0;} break;
                case 'ArrowRight': if(dx!==-1){dx=1;dy=0;} break;
            }
        });

        // 随机生成食物
        function createFood(){
            food.x = Math.floor(Math.random()*(canvas.width/grid));
            food.y = Math.floor(Math.random()*(canvas.height/grid));
            // 避免食物刷在蛇身上
            snake.forEach(seg=>{
                if(seg.x===food.x && seg.y===food.y) createFood();
            })
        }

        // 游戏循环渲染
        function gameLoop(){
            if(gameOver){
                ctx.fillStyle = '#fff';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束！刷新页面重玩', canvas.width/2, canvas.height/2);
                return;
            }
            requestAnimationFrame(gameLoop);
            // 降低帧率，控制速度
            if(Date.now() % 8 !==0) return;

            // 蛇头新位置
            const head = {x:snake[0].x+dx, y:snake[0].y+dy};
            // 撞墙判定
            if(head.x<0||head.x>=canvas.width/grid||head.y<0||head.y>=canvas.height/grid){
                gameOver = true;
            }
            // 撞到自己判定
            snake.forEach(seg=>{
                if(seg.x===head.x && seg.y===head.y) gameOver=true;
            })

            snake.unshift(head);
            // 判断是否吃到食物
            if(head.x===food.x && head.y===food.y){
                score++;
                scoreDom.innerText = score;
                createFood();
            }else{
                snake.pop();
            }

            // 绘制背景
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            // 绘制蛇
            ctx.fillStyle = '#4cd964';
            snake.forEach(seg=>{
                ctx.fillRect(seg.x*grid, seg.y*grid, grid-1, grid-1);
            })
            // 绘制食物
            ctx.fillStyle = '#ff3b30';
            ctx.fillRect(food.x*grid, food.y*grid, grid-1, grid-1);
        }

        createFood();
        gameLoop();
    </script>
    <meta charset="UTF-8">
    <title>简易留言板</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
        body{max-width:800px;margin:30px auto;padding:0 20px;background:#f5f7fa;}
        h2{text-align:center;color:#2d3748;margin-bottom:25px;}
        .form-box{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 8px #eee;margin-bottom:30px;}
        input,textarea{width:100%;margin:8px 0;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px;}
        textarea{height:100px;resize:vertical;}
        button{background:#4299e1;color:white;border:none;padding:11px 30px;border-radius:4px;cursor:pointer;font-size:15px;}
        button:hover{background:#3182ce;}
        .msg-list{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 8px #eee;}
        .msg-item{padding:12px 0;border-bottom:1px solid #eee;}
        .msg-name{font-weight:bold;color:#2d3748;margin-bottom:5px;}
        .msg-content{color:#4a5568;line-height:1.6;}
    </style>
</head>
<body>
<h2>在线留言板</h2>
<!-- Formspree表单，先去formspree.io注册获取自己的接口地址替换action -->
<div class="form-box">
    <form action="https://formspree.io/f/你的专属ID" method="POST">
        <input type="text" name="昵称" placeholder="请输入你的昵称" required>
        <textarea name="留言内容" placeholder="写下你的留言..." required></textarea>
        <button type="submit">提交留言</button>
    </form>
</div>

<div class="msg-list">
    <h3>留言展示区（手动更新展示）</h3>
    <div class="msg-item">
        <div class="msg-name">示例访客</div>
        <div class="msg-content">这是一条示例留言~</div>
    </div>
</div>
</body>
</html>
